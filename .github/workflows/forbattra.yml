name: Självförbättring (varje vecka)

on:
  schedule:
    - cron: "30 1 * * 0"   # söndagar 01:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: trendbot

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testa varianter och byt bara om en är tydligt bättre
        env:
          BOT_NO_BROWSER: "1"
        run: python bot.py forbattra
      - name: Spara
        run: |
          git config user.name "trendbot"
          git config user.email "trendbot@users.noreply.github.com"
          git add trend_config.json FORBATTRING.md
          git commit -m "Självförbättring $(date -u +%F)" || echo "Inget nytt"
          git pull --rebase
          git push
      - name: Berätta vad som hände (mejl)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --label timrapport --state open --json number --jq '.[0].number')
          gh issue comment "$ISSUE" --body-file FORBATTRING.md
