name: Morgonrapport

on:
  schedule:
    - cron: "0 7 * * *"   # 08:00 svensk vintertid (09:00 sommartid)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency: morgon

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py morgon
      - name: Skicka morgonrapporten (GitHub mejlar den)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --label morgonrapport --state open --json number --jq '.[0].number' || true)
          if [ -z "$ISSUE" ]; then
            gh label create morgonrapport --color fbca04 --description "Morgonrapporter" || true
            URL=$(gh issue create --title "☀️ Morgonrapporter" --label morgonrapport \
              --body "Varje morgon kl 08: nattens resultat för alla botar. @PippiLangstrump")
            ISSUE=${URL##*/}
          fi
          gh issue comment "$ISSUE" --body-file MORGONRAPPORT.md
