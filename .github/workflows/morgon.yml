name: Morgonrapport

on:
  schedule:
    - cron: "0 5 * * *"   # 06:00 svensk vintertid (07:00 sommartid)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency: morgon

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py morgon
      - name: Skicka morgonrapporten (GitHub mejlar den)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --label morgonrapport --state open --json number --jq '.[0].number' || true)
          if [ -z "$ISSUE" ]; then
            gh label create morgonrapport --color fbca04 --description "Morgonrapporter" || true
            URL=$(gh issue create --title "☀️ Morgonrapporter" --label morgonrapport \
              --body "Varje morgon kl 06: nattens resultat för alla botar. @PippiLangstrump")
            ISSUE=${URL##*/}
          fi
          H=$(TZ=Europe/Stockholm date +%H)
          if [ "$H" \< "05" ] || [ "$H" \> "11" ]; then echo "Fel tid ($H) - hoppar över"; exit 0; fi
          LAST=$(gh api "repos/${{ github.repository }}/issues/$ISSUE/comments?per_page=100" --jq '.[-1].body' | head -1 || true)
          if [ "$LAST" = "$(head -1 MORGONRAPPORT.md)" ]; then echo "Redan skickad idag"; exit 0; fi
          gh issue comment "$ISSUE" --body-file MORGONRAPPORT.md
