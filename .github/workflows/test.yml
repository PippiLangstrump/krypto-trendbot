name: Snabbtest (sparar inget)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import bot, time
          for kol, w in bot.COPY_WALLETS.items():
              try:
                  sigs = bot._rpc("getSignaturesForAddress", [w, {"limit": 15}])
                  print("KOL", kol, "signaturer", len(sigs), "senaste", sigs[0]["blockTime"] if sigs else None)
                  n = 0
                  for sg in sigs[:15]:
                      tx = bot._rpc("getTransaction", [sg["signature"], {"encoding": "jsonParsed", "maxSupportedTransactionVersion": 1}])
                      sw = bot.parse_swap(tx, w)
                      if sw:
                          n += 1
                          m = bot._token_market(sw[0])
                          print("  SWAP", kol, sw[1], round(sw[2], 3), "SOL", round(sw[3], 2), m[:3] if m else None)
                      time.sleep(0.6)
                  print("  tolkade swappar:", n)
              except Exception as e:
                  print("KOL", kol, "FEL", e)
          bot.COPY_STATE_FILE = "/tmp/copy.json"
          bot.run_copy_watch(3)
          import json
          st = json.load(open("/tmp/copy.json"))
          print("WATCH", st["seen_kol"], len(st["pos"]), [p["name"] for p in st["pos"].values()])
          PY
