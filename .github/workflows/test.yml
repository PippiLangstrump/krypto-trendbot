name: Snabbtest (sparar inget)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import bot, time
          w = bot.COPY_WALLETS["West"]
          for c in ("finalized", "confirmed"):
              sig = bot._rpc("getSignaturesForAddress", [w, {"limit": 1, "commitment": c}])
              print("COMMIT", c, "senaste för", round(time.time() - (sig[0]["blockTime"] or 0), 1), "s sedan")
              tx = bot._rpc("getTransaction", [sig[0]["signature"], {"encoding": "jsonParsed", "maxSupportedTransactionVersion": 1, "commitment": "confirmed"}])
              print("COMMIT tx ok", bool(tx))
          bot.COPY_STATE_FILE = "/tmp/a.json"; bot.COPY_SMART_FILE = "/tmp/b.json"
          bot.run_copy_watch(2)
          PY
