name: Snabbtest (sparar inget)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import bot, time
          t = time.time()
          c = bot.gem_candidates(int(t * 1000))
          print("KANDIDATER", len(c), "tid", round(time.time() - t), "s")
          for p in c[:10]:
              print("K", p["chainId"], p["baseToken"]["symbol"], p["liquidity"]["usd"], p["volume"]["h24"], p["fdv"], p["priceChange"])
          PY
