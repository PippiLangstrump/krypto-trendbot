name: Snabbtest (sparar inget)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import bot, time
          for kol, w in bot.COPY_WALLETS.items():
              try:
                  sigs = bot._rpc("getSignaturesForAddress", [w, {"limit": 200}])
                  ok = [x for x in sigs if not x.get("err")]
                  n = 0
                  for sg in ok[:8]:
                      tx = bot._rpc("getTransaction", [sg["signature"], {"encoding": "jsonParsed", "maxSupportedTransactionVersion": 1}])
                      sw = bot.parse_swap(tx, w)
                      if sw:
                          n += 1
                          if n <= 2:
                              print("  SWAP", kol, sw[1], round(sw[2], 2), "SOL", round(sw[3], 2))
                      time.sleep(0.5)
                  age = (time.time() - ok[0]["blockTime"]) / 3600 if ok else None
                  print("KOL", kol, "sig", len(sigs), "ok", len(ok), "swappar i 8 senaste", n, "senaste ok (h sedan)", age and round(age, 1))
              except Exception as e:
                  print("KOL", kol, "FEL", e)
              time.sleep(1)
          PY
