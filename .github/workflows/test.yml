name: Snabbtest (sparar inget)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import bot, time, json
          w = bot.COPY_WALLETS["Cented"]
          sigs = bot._rpc("getSignaturesForAddress", [w, {"limit": 6}])
          for sg in sigs:
              tx = bot._rpc("getTransaction", [sg["signature"], {"encoding": "jsonParsed", "maxSupportedTransactionVersion": 1}])
              if not tx:
                  print("DBG none"); continue
              keys = [k["pubkey"] if isinstance(k, dict) else k for k in tx["transaction"]["message"]["accountKeys"]]
              m = tx["meta"]
              i = keys.index(w) if w in keys else -1
              print("DBG ver", tx.get("version"), "err", m.get("err"), "inkeys", i, "nkeys", len(keys), "loaded", list((m.get("loadedAddresses") or {}).keys()))
              if i >= 0:
                  print("DBG sol", (m["postBalances"][i] - m["preBalances"][i]) / 1e9)
              print("DBG pre", [(x.get("owner", "")[:6], x["mint"][:6], x["uiTokenAmount"].get("uiAmount")) for x in (m.get("preTokenBalances") or [])][:6])
              print("DBG post", [(x.get("owner", "")[:6], x["mint"][:6], x["uiTokenAmount"].get("uiAmount")) for x in (m.get("postTokenBalances") or [])][:6])
              print("DBG logs", [l[:60] for l in (m.get("logMessages") or [])][:4])
              time.sleep(0.6)
          PY
