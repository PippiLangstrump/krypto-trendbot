name: Snabbtest (sparar inget)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import bot, time
          for kol, w in bot.COPY_WALLETS.items():
              try:
                  sigs = bot._rpc("getSignaturesForAddress", [w, {"limit": 1000, "commitment": "confirmed"}])
                  ok = [x for x in sigs if not x.get("err")]
                  span = (time.time() - sigs[-1]["blockTime"]) / 3600 if sigs else 0
                  n = 0; last = None
                  for sg in ok[:40]:
                      tx = bot._rpc("getTransaction", [sg["signature"], {"encoding": "jsonParsed", "maxSupportedTransactionVersion": 1, "commitment": "confirmed"}])
                      sw = bot.parse_swap(tx, w)
                      if sw:
                          n += 1
                          last = last or round((time.time() - sg["blockTime"]) / 60)
                  print("DIAG", kol, "sigs", len(sigs), "täcker", round(span, 2), "h, ok", len(ok), "swappar bland 40 senaste ok", n, "senaste swap för", last, "min sedan")
              except Exception as e:
                  print("DIAG", kol, "FEL", str(e)[:120])
          PY
