name: Snabbtest (sparar inget)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import bot, time, json, collections
          now = int(time.time() * 1000)
          toks = collections.Counter()
          sample = {}
          for path in ("/token-profiles/latest/v1", "/token-boosts/latest/v1", "/token-boosts/top/v1"):
              try:
                  d = bot._dex(path)
                  print(path, type(d).__name__, len(d))
                  for t in d:
                      toks[t.get("chainId")] += 1
                      sample.setdefault(t.get("chainId"), t.get("tokenAddress"))
              except Exception as e:
                  print(path, "FEL", e)
          print("KEDJOR", toks.most_common(8))
          addr = sample.get("solana")
          r = bot._dex(f"/tokens/v1/solana/{addr}")
          print("TOKENS-SVAR", type(r).__name__, json.dumps(r)[:1500])
          PY
