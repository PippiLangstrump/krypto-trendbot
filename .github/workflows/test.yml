name: Snabbtest (sparar inget)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import bot, time, json
          calls = [0]
          orig = bot._rpc
          def counting(m, p):
              calls[0] += 1
              return orig(m, p)
          bot._rpc = counting
          bot.COPY_STATE_FILE = "/tmp/copy.json"
          t = time.time()
          bot.run_copy_watch(2)
          st = json.load(open("/tmp/copy.json"))
          print("RESULTAT anrop", calls[0], "på", round(time.time() - t), "s, per plånbok/s", round(calls[0] / 10 / (time.time() - t), 2), "köp", len(st["pos"]), [p["name"] for p in st["pos"].values()], "sett", st["seen_kol"])
          PY
