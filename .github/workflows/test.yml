name: Snabbtest (sparar inget)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import bot, time, json
          now = int(time.time() * 1000)
          c = bot.gem_candidates(now)
          print("KANDIDATER", len(c))
          for p in c[:8]:
              print(p["chainId"], p["baseToken"]["symbol"], p["priceUsd"], p["liquidity"]["usd"], p["volume"]["h24"], p["fdv"])
          if c:
              p = c[0]
              q = bot._dex(f"/latest/dex/pairs/{p['chainId']}/{p['pairAddress']}")
              print("PAIRS-API OK", bool(q.get("pairs")))
          pr = bot.fetch_all_prices()
          print("PRISER", len(pr), sorted(pr)[:15])
          PY
