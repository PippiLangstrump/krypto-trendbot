name: Trendbot

on:
  schedule:
    - cron: "7 * * * *"   # varje timme (UTC)
  workflow_dispatch:       # kan startas manuellt med "Run workflow"

permissions:
  contents: write
  issues: write
  actions: write

concurrency: trendbot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kör trendbotarna och bevaka priserna varje sekund (papperspengar)
        env:
          BOT_NO_BROWSER: "1"
        run: |
          # kör fram till ~30 sek före nästa hela timme, så mejlet kommer prick kl XX:00
          M=$(python3 -c "import time; s=3600-time.time()%3600-30; s = s if s > 150 else s + 3600; print(round(s/60, 2))")
          M2=$(python3 -c "print(round($M - 0.35, 2))")
          echo "Bevakar i $M minuter"
          git config user.name "trendbot"
          git config user.email "trendbot@users.noreply.github.com"
          python bot.py trendwatch long $M & P1=$!
          sleep 20
          python bot.py trendwatch longshort $M2 & P2=$!
          python bot.py fastwatch $M & P3=$!
          python bot.py gemwatch $M & P4=$!
          python bot.py copywatch $M & P5=$!
          # uppdatera webbsidan och spara läget var 5:e minut medan botarna kör
          (
            while true; do
              sleep 300
              python bot.py webbsida > /dev/null 2>&1 || true
              git add docs *.json > /dev/null 2>&1
              if git commit -q -m "Live-uppdatering $(date -u +%H:%M)" > /dev/null 2>&1; then
                (git pull -q --rebase --autostash -X theirs > /dev/null 2>&1 || git rebase --abort > /dev/null 2>&1) && git push -q > /dev/null 2>&1 || true
              fi
            done
          ) & UPD=$!
          wait $P1 $P2 $P3 $P4 $P5
          kill $UPD || true
          python bot.py fundingonce || echo "Funding-boten misslyckades denna gång"
          python bot.py chartonce || echo "Mönsterläsaren misslyckades denna gång"
          python bot.py league || echo "Lagledaren misslyckades denna gång"
          python bot.py webbsida || echo "Webbsidan misslyckades denna gång"
          python bot.py mailrapport
      - name: Spara resultat
        run: |
          {
            echo "# Krypto-trendbot (papperstrading)"
            echo
            echo "Körs automatiskt varje timme på GitHub och ombalanserar en gång per dygn. Inga riktiga pengar."
            echo
            echo "Detaljerade rapporter: trend_rapport_live.html och trend_rapport_live_langkort.html (ladda ner och öppna i webbläsaren)."
            echo
            cat SAMMANFATTNING_lang.md
            echo
            cat SAMMANFATTNING_langkort.md
          } > README.md
          git config user.name "trendbot"
          git config user.email "trendbot@users.noreply.github.com"
          git add -A
          git commit -m "Uppdatering $(date -u +%F_%H:%M)" || echo "Inget nytt"
          # botarnas egna filer vinner alltid vid krock
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs && git push && break
            git rebase --abort || true
            sleep 5
          done
      - name: Skicka timrapport (GitHub mejlar den till dig)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --label timrapport --state open --json number --jq '.[0].number' || true)
          if [ -z "$ISSUE" ]; then
            gh label create timrapport --color 1f883d --description "Timrapporter från trendbotten" || true
            URL=$(gh issue create --title "Timrapporter från trendbotten" --label timrapport \
              --body "Här kommer en kort rapport varje timme (papperspengar). @PippiLangstrump får dem som mejl.")
            ISSUE=${URL##*/}
          fi
          gh issue comment "$ISSUE" --body-file MAILRAPPORT.md
      - name: Starta nästa timme direkt (så det aldrig blir glapp)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run trendbot.yml --ref main
