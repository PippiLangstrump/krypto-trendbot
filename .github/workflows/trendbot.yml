name: Trendbot

on:
  schedule:
    - cron: "7 * * * *"   # varje timme (UTC)
  workflow_dispatch:       # kan startas manuellt med "Run workflow"

permissions:
  contents: write
  issues: write

concurrency: trendbot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kör trendbotarna (papperspengar)
        env:
          BOT_NO_BROWSER: "1"
        run: python bot.py trendonce long longshort
      - name: Spara resultat
        run: |
          {
            echo "# Krypto-trendbot (papperstrading)"
            echo
            echo "Körs automatiskt varje timme på GitHub och ombalanserar en gång per dygn. Inga riktiga pengar."
            echo
            echo "Detaljerade rapporter: trend_rapport_live.html och trend_rapport_live_langkort.html (ladda ner och öppna i webbläsaren)."
            echo
            cat SAMMANFATTNING_lang.md
            echo
            cat SAMMANFATTNING_langkort.md
          } > README.md
          git config user.name "trendbot"
          git config user.email "trendbot@users.noreply.github.com"
          git add -A
          git commit -m "Uppdatering $(date -u +%F_%H:%M)" || echo "Inget nytt"
          git pull --rebase
          git push
      - name: Skicka timrapport (GitHub mejlar den till dig)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --label timrapport --state open --json number --jq '.[0].number' || true)
          if [ -z "$ISSUE" ]; then
            gh label create timrapport --color 1f883d --description "Timrapporter från trendbotten" || true
            URL=$(gh issue create --title "Timrapporter från trendbotten" --label timrapport \
              --body "Här kommer en kort rapport varje timme (papperspengar). @PippiLangstrump får dem som mejl.")
            ISSUE=${URL##*/}
          fi
          gh issue comment "$ISSUE" --body-file MAILRAPPORT.md
