name: Test - funding-data

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import bot, time
          for s in bot.SYMBOLS:
              try:
                  h = bot.funding_history(s, int(time.time()*1000) - 3*86400000)
                  print(s, len(h), h[-1] if h else None)
              except Exception as e:
                  print(s, "FEL", e)
          PY
